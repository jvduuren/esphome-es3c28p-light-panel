# ======================================================================
# The interface
# ======================================================================
lvgl:
  displays: [lcd]
  touchscreens: [ctp]
  # 100% gives LVGL a full-screen buffer, so one SPI transfer per frame
  # instead of four. Saves three rounds of window commands and transaction
  # setup. Affordable here: 150 kB out of 8 MB PSRAM.
  buffer_size: 100%
  bg_color: 0x0A0B0D

  # Screensaver after 30 s of quiet. The backlight goes well down but not
  # off: that keeps the clock readable at night without lighting up the room,
  # and is easier on the backlight LEDs.
  on_idle:
    timeout: 30s
    then:
      # No page animation. Tested on hardware: a slide or a fade has to push
      # the full screen over SPI for every frame, and at ~31 ms per screen
      # that leaves only a handful of frames. It stutters visibly, which looks
      # worse than an instant switch. The transition now lives entirely in the
      # backlight, which does fade smoothly because PWM is independent of
      # draw speed.
      - lvgl.page.show: page_clock

      # A short wait so the clock stands there brightly first and only then
      # fades down. That keeps a calm transition without any redrawing.
      - delay: 250ms
      - if:
          # If you wake the panel during that 250 ms, this must not dim the
          # screen afterwards anyway.
          condition:
            lvgl.page.is_showing: page_clock
          then:
            - light.turn_on:
                id: backlight
                brightness: 25%
                transition_length: 2s

  pages:

    # ------------------------------------------------------------------
    # Home page: header + 3x2 grid
    # ------------------------------------------------------------------
    - id: page_home
      bg_color: 0x0A0B0D
      bg_opa: COVER
      widgets:
        - label:
            id: hdr_title
            text: "${ui_title}"
            text_font: f_header
            text_color: 0xEDE9E1
            text_letter_space: 3
            x: 14
            y: 12
        - label:
            id: hdr_clock
            text: "--:--"
            text_font: f_small
            text_color: 0xC8A45C
            align: TOP_RIGHT
            x: -14
            y: 18
        # Gold hairline under the header
        - obj:
            x: 14
            y: 38
            width: 292
            height: 1
            bg_color: 0xC8A45C
            bg_opa: 60%
            border_width: 0
            radius: 0

        - obj:
            id: grid_wrap
            # Larger than the grid itself, with pad_all as margin: LVGL
            # clips children to their parent, and without that slack the drop
            # shadows along the outer edges would be cut off.
            x: 6
            y: 44
            width: 308
            height: 192
            bg_opa: TRANSP
            border_width: 0
            pad_all: 8
            layout:
              type: grid
              grid_columns: 3
              grid_rows: 2
              pad_row: 8
              pad_column: 8
            widgets:
              - button:
                  id: tile1
                  <<: *tile_look
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile1_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light1_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile1_state
                        text: "${ui_off}"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light1_entity}
                  on_long_press:
                    - lambda: 'id(active_entity) = "${light1_entity}";'
                    - lvgl.label.update:
                        id: dim_title
                        text: ${light1_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l1_bri).state;'

              - button:
                  id: tile2
                  <<: *tile_look
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile2_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light2_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile2_state
                        text: "${ui_off}"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light2_entity}
                  on_long_press:
                    - lambda: 'id(active_entity) = "${light2_entity}";'
                    - lvgl.label.update:
                        id: dim_title
                        text: ${light2_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l2_bri).state;'

              - button:
                  id: tile3
                  <<: *tile_look
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile3_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light3_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile3_state
                        text: "${ui_off}"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light3_entity}
                  on_long_press:
                    - lambda: 'id(active_entity) = "${light3_entity}";'
                    - lvgl.label.update:
                        id: dim_title
                        text: ${light3_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l3_bri).state;'

              - button:
                  id: tile4
                  <<: *tile_look
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile4_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light4_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile4_state
                        text: "${ui_off}"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light4_entity}
                  on_long_press:
                    - lambda: 'id(active_entity) = "${light4_entity}";'
                    - lvgl.label.update:
                        id: dim_title
                        text: ${light4_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l4_bri).state;'

              - button:
                  id: tile5
                  <<: *tile_look
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 2
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile5_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light5_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile5_state
                        text: "${ui_off}"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light5_entity}
                  on_long_press:
                    - lambda: 'id(active_entity) = "${light5_entity}";'
                    - lvgl.label.update:
                        id: dim_title
                        text: ${light5_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l5_bri).state;'

              - button:
                  id: tile6
                  <<: *tile_look
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile6_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light6_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile6_state
                        text: "${ui_off}"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light6_entity}
                  on_long_press:
                    - lambda: 'id(active_entity) = "${light6_entity}";'
                    - lvgl.label.update:
                        id: dim_title
                        text: ${light6_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l6_bri).state;'

    # ------------------------------------------------------------------
    # Dimming page: one light, large gold arc
    # ------------------------------------------------------------------
    - id: page_dim
      bg_color: 0x0A0B0D
      bg_opa: COVER
      widgets:
        - button:
            id: dim_back
            x: 2
            y: 2
            width: 62
            height: 62
            radius: 31
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            text_color: 0xC8A45C
            widgets:
              - label:
                  text: "\U000F0141"
                  text_font: f_icon_sm
                  align: CENTER
            on_short_click:
              - lvgl.page.show: page_home

        - label:
            id: dim_title
            text: "${ui_light}"
            text_font: f_header
            text_color: 0xEDE9E1
            text_letter_space: 2
            align: TOP_RIGHT
            x: -26
            y: 56

        - arc:
            id: dim_arc
            x: 34
            y: 66
            width: 132
            height: 132
            min_value: 1
            max_value: 100
            value: 50
            adjustable: true       # without this the arc cannot be dragged
            start_angle: 135
            end_angle: 45
            arc_width: 10
            arc_color: 0x1C2027
            indicator:
              arc_color: 0xC8A45C
              arc_width: 10
            knob:
              bg_color: 0xE8C87E
              pad_all: 5
            on_value:
              - lvgl.label.update:
                  id: dim_pct
                  text: !lambda |-
                    char buf[8];
                    snprintf(buf, sizeof(buf), "%d", (int) x);
                    return std::string(buf);
            on_release:
              # Send on release only, not while dragging - otherwise you
              # flood Home Assistant with commands.
              - if:
                  condition:
                    lambda: 'return !id(ui_updating);'
                  then:
                    - homeassistant.action:
                        action: light.turn_on
                        data_template:
                          entity_id: "{{ ent }}"
                          brightness_pct: "{{ pct }}"
                        variables:
                          ent: !lambda |-
                            return id(active_entity);
                          pct: !lambda |-
                            return (int) lv_arc_get_value(id(dim_arc));

        - label:
            id: dim_pct
            text: "50"
            text_font: f_huge
            text_color: 0xEDE9E1
            # Centred on the arc, not on the screen: screen centre is
            # x=160, arc centre x=100, hence 60 px to the left.
            align: CENTER
            x: -60
            y: 12
        - label:
            text: "%"
            text_font: f_small
            text_color: 0x585E68
            align: CENTER
            x: -60
            y: 44

        - button:
            id: dim_toggle
            align: BOTTOM_RIGHT
            x: -26
            y: -38
            width: 130
            height: 50
            radius: 25
            bg_opa: COVER
            bg_color: 0x272C35
            bg_grad_color: 0x14171D
            bg_grad_dir: VER
            border_width: 1
            border_color: 0xC8A45C
            shadow_color: 0x000000
            shadow_opa: 70%
            shadow_width: 12
            shadow_offset_y: 4
            text_color: 0xE8C87E
            pressed:
              bg_color: 0x0F1216
              bg_grad_color: 0x1E232B
              shadow_opa: 0%
            widgets:
              # One centred label. Icon and text as two opposed labels ran
              # into each other at this button width: LEFT_MID and RIGHT_MID
              # overlap as soon as the text is wider than half the button.
              - label:
                  text: "${ui_toggle}"
                  text_font: f_tile
                  text_letter_space: 2
                  align: CENTER
            on_short_click:
              - homeassistant.action:
                  action: light.toggle
                  data_template:
                    entity_id: "{{ ent }}"
                  variables:
                    ent: !lambda |-
                      return id(active_entity);

    # ------------------------------------------------------------------
    # Screensaver: flip clock. No interactive elements; any touch takes you
    # back to the home page (see touchscreen: on_release).
    # ------------------------------------------------------------------
    - id: page_clock
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # There used to be a full-screen invisible button here to dismiss
        # the screensaver. On hardware it turned out not to work: with only
        # that button the panel responded to nothing. Waking therefore happens
        # at touchscreen: on_release, outside LVGL.
        - obj:
            <<: *flip_card
            x: 24
            widgets:
              - label:
                  id: clk_hh
                  text: "--"
                  text_font: f_flip
                  text_color: 0xE8E2D8
                  align: CENTER
              - obj: *flip_seam

        - obj:
            <<: *flip_card
            x: 170
            widgets:
              - label:
                  id: clk_mm
                  text: "--"
                  text_font: f_flip
                  text_color: 0xE8E2D8
                  align: CENTER
              - obj: *flip_seam

        - label:
            id: clk_date
            text: ""
            text_font: f_tile
            text_color: 0xE8E2D8   # same as the digits
            text_letter_space: 1
            align: BOTTOM_MID
            y: -16
