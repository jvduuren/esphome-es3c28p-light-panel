                        id: open_dim
                        bri: !lambda 'return id(l6_bri).state;'

    # ------------------------------------------------------------------
    # Dimpaneel: één lamp, grote gouden ring
    # ------------------------------------------------------------------
    - id: page_dim
      bg_color: 0x0A0B0D
      bg_opa: COVER
      widgets:
        - button:
            id: dim_back
            x: 2
            y: 2
            width: 62
            height: 62
            radius: 31
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            text_color: 0xC8A45C
            widgets:
              - label:
                  text: "\U000F0141"
                  text_font: f_icon_sm
                  align: CENTER
            on_short_click:
              - lvgl.page.show: page_home

        - label:
            id: dim_title
            text: "Lamp"
            text_font: f_header
            text_color: 0xEDE9E1
            text_letter_space: 2
            align: TOP_RIGHT
            x: -26
            y: 56

        - arc:
            id: dim_arc
            x: 34
            y: 66
            width: 132
            height: 132
            min_value: 1
            max_value: 100
            value: 50
            adjustable: true       # zonder dit is de ring niet versleepbaar
            start_angle: 135
            end_angle: 45
            arc_width: 10
            arc_color: 0x1C2027
            indicator:
              arc_color: 0xC8A45C
              arc_width: 10
            knob:
              bg_color: 0xE8C87E
              pad_all: 5
            on_value:
              - lvgl.label.update:
                  id: dim_pct
                  text: !lambda |-
                    char buf[8];
                    snprintf(buf, sizeof(buf), "%d", (int) x);
                    return std::string(buf);
            on_release:
              # Alleen bij loslaten sturen, niet tijdens het slepen — anders
              # overspoel je Home Assistant met commando's.
              - if:
                  condition:
                    lambda: 'return !id(ui_updating);'
                  then:
                    - homeassistant.action:
                        action: light.turn_on
                        data_template:
                          entity_id: "{{ ent }}"
                          brightness_pct: "{{ pct }}"
                        variables:
                          ent: !lambda |-
                            return id(active_entity);
                          pct: !lambda |-
                            return (int) lv_arc_get_value(id(dim_arc));

        - label:
            id: dim_pct
            text: "50"
            text_font: f_huge
            text_color: 0xEDE9E1
            # Gecentreerd op de ring, niet op het scherm: schermmidden is
            # x=160, ringmidden x=92, dus 68 px naar links.
            # Gecentreerd op de ring: schermmidden x=160, ringmidden x=100.
            align: CENTER
            x: -60
            y: 12
        - label:
            text: "%"
            text_font: f_small
            text_color: 0x585E68
            align: CENTER
            x: -60
            y: 44

        - button:
            id: dim_toggle
            align: BOTTOM_RIGHT
            x: -26
            y: -38
            width: 130
            height: 50
            radius: 25
            bg_opa: COVER
            bg_color: 0x272C35
            bg_grad_color: 0x14171D
            bg_grad_dir: VER
            border_width: 1
            border_color: 0xC8A45C
            shadow_color: 0x000000
            shadow_opa: 70%
            shadow_width: 12
            shadow_offset_y: 4
            text_color: 0xE8C87E
            pressed:
              bg_color: 0x0F1216
              bg_grad_color: 0x1E232B
              shadow_opa: 0%
            widgets:
              # Eén gecentreerd label. Icoon en tekst als twee tegenover
              # elkaar uitgelijnde labels liepen bij deze knopbreedte door
              # elkaar heen: LEFT_MID en RIGHT_MID overlappen zodra de tekst
              # breder is dan de helft van de knop.
              - label:
                  text: "AAN / UIT"
                  text_font: f_tile
                  text_letter_space: 2
                  align: CENTER
            on_short_click:
              - homeassistant.action:
                  action: light.toggle
                  data_template:
                    entity_id: "{{ ent }}"
                  variables:
                    ent: !lambda |-
                      return id(active_entity);

    # ------------------------------------------------------------------
    # Screensaver: flip-klok. Geen bedienbare elementen; elke aanraking
    # brengt je terug naar het startscherm (zie touchscreen: on_touch).
    # ------------------------------------------------------------------
    - id: page_clock
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # Hier stond een onzichtbare knop over het hele scherm om de
        # screensaver weg te tikken. Die bleek op hardware niet te werken:
        # met alleen die knop reageerde het paneel nergens op. Het wekken
        # gebeurt daarom bij touchscreen: on_release, buiten LVGL om.
        - obj:
            <<: *flip_card
            x: 24
            widgets:
              - label:
                  id: clk_hh
                  text: "--"
                  text_font: f_flip
                  text_color: 0xE8E2D8
                  align: CENTER
              - obj: *flip_seam

        - obj:
            <<: *flip_card
            x: 170
            widgets:
              - label:
                  id: clk_mm
                  text: "--"
                  text_font: f_flip
                  text_color: 0xE8E2D8
                  align: CENTER
              - obj: *flip_seam

        - label:
            id: clk_date
            text: ""
            text_font: f_tile
            text_color: 0xE8E2D8   # gelijk aan de cijfers
            text_letter_space: 1
            align: BOTTOM_MID
            y: -16
