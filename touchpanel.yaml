# ======================================================================
# De interface
# ======================================================================
lvgl:
  displays: [lcd]
  touchscreens: [ctp]
  # 100% geeft LVGL een volledige schermbuffer, dus één SPI-overdracht per
  # beeldje in plaats van vier. Scheelt drie keer de overhead van
  # venstercommando's en transactieopzet. Kan hier ruim: 150 kB in 8 MB PSRAM.
  buffer_size: 100%
  bg_color: 0x0A0B0D

  # Screensaver na een minuut stilte. De achtergrondverlichting gaat ver
  # omlaag maar niet uit: zo blijft de klok 's nachts leesbaar zonder de
  # kamer te verlichten, en spaart het paneel zijn eigen paneel.
  on_idle:
    timeout: 30s
    then:
      # Geen paginanimatie. Getest op hardware: een schuivende of vervagende
      # overgang moet elk beeldje het volledige scherm over SPI sturen, en bij
      # ~31 ms per scherm blijven daar maar een handvol beeldjes over. Dat
      # stottert zichtbaar, en dat oogt slechter dan een directe wissel.
      # De overgang zit nu volledig in de verlichting: die dimt wel vloeiend,
      # want PWM staat los van de tekensnelheid.
      - lvgl.page.show: page_clock

      # Even wachten zodat de klok eerst helder in beeld staat en pas daarna
      # wegzakt. Zo blijft er een rustige overgang, zonder beeldopbouw.
      - delay: 250ms
      - if:
          # Tik je tijdens die 800 ms het paneel wakker, dan mag dit niet
          # alsnog het scherm dimmen.
          condition:
            lvgl.page.is_showing: page_clock
          then:
            - light.turn_on:
                id: backlight
                brightness: 25%
                transition_length: 2s

  pages:

    # ------------------------------------------------------------------
    # Startscherm: kop + 2x3 raster
    # ------------------------------------------------------------------
    - id: page_home
      bg_color: 0x0A0B0D
      bg_opa: COVER
      widgets:
        - label:
            id: hdr_title
            text: "VERLICHTING"
            text_font: f_header
            text_color: 0xEDE9E1
            text_letter_space: 3
            x: 14
            y: 12
        - label:
            id: hdr_clock
            text: "--:--"
            text_font: f_small
            text_color: 0xC8A45C
            align: TOP_RIGHT
            x: -14
            y: 18
        # Gouden haarlijn onder de kop
        - obj:
            x: 14
            y: 38
            width: 292
            height: 1
            bg_color: 0xC8A45C
            bg_opa: 60%
            border_width: 0
            radius: 0

        - obj:
            id: grid_wrap
            # Groter dan het raster zelf, met pad_all als marge: LVGL knipt
            # kinderen af op de ouder, en zonder die speling zouden de
            # slagschaduwen langs de buitenranden worden afgesneden.
            x: 6
            y: 44
            width: 308
            height: 192
            bg_opa: TRANSP
            border_width: 0
            pad_all: 8
            layout:
              type: grid
              grid_columns: 3
              grid_rows: 2
              pad_row: 8
              pad_column: 8
            widgets:
              - button:
                  id: tile1
                  <<: *tile_look
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile1_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light1_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile1_state
                        text: "UIT"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light1_entity}
                  on_long_press:
                    - lambda: 'id(active_entity) = "${light1_entity}";'
                    - lvgl.label.update:
                        id: dim_title
                        text: ${light1_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l1_bri).state;'

              - button:
                  id: tile2
                  <<: *tile_look
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile2_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light2_name}
                        text_font: f_tile
                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile2_state
                        text: "UIT"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
