              - button:
                  id: tile6
                  <<: *tile_look
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
                        id: tile6_icon
                        text_color: 0x8A8074
                        align: TOP_MID
                        y: 4
                    - label:
                        text: ${light6_name}
