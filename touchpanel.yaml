                        text_color: 0xEDE9E1
                        align: BOTTOM_MID
                        y: -20
                    - label:
                        id: tile3_state
                        text: "UIT"
                        text_font: f_small
                        text_letter_space: 2
                        align: BOTTOM_MID
                        y: -5
                  on_short_click:
                    - homeassistant.action:
