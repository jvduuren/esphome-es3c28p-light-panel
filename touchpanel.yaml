                    - lvgl.label.update:
                        id: dim_title
                        text: ${light4_name}
                    - script.execute:
                        id: open_dim
                        bri: !lambda 'return id(l4_bri).state;'

              - button:
                  id: tile5
                  <<: *tile_look
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 2
                  widgets:
                    - obj: *tile_bevel
                    - label:
                        text: "\U000F0335"
                        text_font: f_icon
